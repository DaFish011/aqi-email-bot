name: Collect AQI Data

on:
  schedule:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install requests firebase-admin
      
      - name: Create Firebase credentials file
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: echo "$FIREBASE_KEY" > firebase-key.json
      
      - name: Run AQI collector
        env:
          IQAIR_API_KEY: ${{ secrets.IQAIR_API_KEY }}
        run: python3 collect_aqi.py