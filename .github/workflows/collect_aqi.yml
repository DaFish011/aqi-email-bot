name: Collect AQI Data

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run AQI collector
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python3 collect_aqi.py
      
      - name: Commit and push database updates
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/DaFish011/aqi-email-bot.git
          git add aqi_history.db
          git commit -m "Update AQI history - $(date)" || echo "No changes to commit"
          git push origin main